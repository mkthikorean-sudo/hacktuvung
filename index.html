  --the-kem:linear-gradient(#FBF5E6ee,#FBF5E6d9 58%,#FBF5E6b0),var(--hanok) center bottom/cover no-repeat,#F8F0DE;
  --the-sau:linear-gradient(#FBF5E6f5,#FBF5E6ea 62%,#FBF5E6c4),var(--hanok) center bottom/cover no-repeat,#F8F0DE;
  --f-chu:"Be Vietnam Pro","Noto Sans KR",system-ui,sans-serif;
  --f-han:"Noto Sans KR","Be Vietnam Pro",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--kem);color:var(--nau);font-family:var(--f-chu);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;min-height:0}
.nen{position:fixed;inset:0;z-index:-1;background:linear-gradient(#F7F0DFcc,#F7F0DF66 55%,#F7F0DF22),var(--hanok) center bottom/cover no-repeat}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:disabled{cursor:not-allowed}
input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--nau);outline-offset:2px;border-radius:6px}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance;line-height:1.25}

/* Header */
.top{flex:none;background:var(--trang);border-bottom:1px solid var(--vien);padding-block:5px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;align-items:center;justify-content:space-between;gap:16px}
.top img{display:block;height:40px;width:auto;mix-blend-mode:multiply}
.nav{display:flex;gap:6px}
.nav-w{display:contents}
.nav button{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:11px;font-weight:600;color:var(--nau-vua)}
.nav button:hover{background:var(--kem)}
.nav button[aria-current=page]{background:var(--vang);color:var(--nau-sau)}
.nav svg{width:19px;height:19px;flex:none}
main{flex:1;min-height:0;overflow:auto;padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.wrap{max-width:1200px;height:100%;margin-inline:auto;display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0}
.panel{background:var(--giay);border:1px solid var(--vien);border-radius:16px;padding:16px;min-width:0;min-height:0}
.panel h2{font-size:17px;font-weight:700}
.p-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.muted{color:var(--nau-vua)}.small{font-size:13px}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:6px 13px;white-space:nowrap;border-radius:12px;font-weight:700;background:var(--trang);border:1.5px solid var(--vien);transition:transform .12s,background .12s}
.btn:hover:not(:disabled){background:var(--kem)}
.btn.chinh{background:var(--vang);border-color:var(--vang);color:var(--nau-sau)}
.btn.chinh:hover:not(:disabled){background:#FFE81A}
.btn[aria-pressed=true]{background:var(--nau);border-color:var(--nau);color:#fff}
.btn:disabled{opacity:.5}
.btn svg{width:18px;height:18px;flex:none}
.tron{width:40px;height:40px;border-radius:50%;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 13px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--nau);background:var(--trang);border:1.5px solid var(--vien);white-space:nowrap}
.chip[aria-pressed=true]{background:var(--nau);border-color:var(--nau);color:#fff}
.chip:disabled{opacity:.45}
.picker{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sel{min-height:42px;padding:7px 12px;border-radius:12px;border:1.5px solid var(--vien);background:var(--trang);font-weight:700;max-width:100%;min-width:0}
.ten{font-size:13.5px;color:var(--nau-vua);min-width:0}
.modes{flex:none;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.mode{flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:6px 12px;border-radius:12px;background:var(--trang);border:1.5px solid var(--vien);font-weight:700;font-size:14px;white-space:nowrap}
.mode:hover{border-color:var(--vang)}
.mode.on{background:var(--nau);border-color:var(--nau);color:#fff}
.mode svg{width:19px;height:19px;color:var(--vang-chu)}
.mode.on svg{color:var(--vang)}

/* The card */
.fc{flex:1;min-height:0;perspective:1600px;width:100%;cursor:pointer;touch-action:pan-y;container-type:size}
.fc-in{position:relative;height:100%;transform-style:preserve-3d;transition:transform .42s cubic-bezier(.3,.8,.3,1)}
.fc.lat .fc-in{transform:rotateX(180deg)}
.fc.vao-p .fc-in{animation:vaoP .24s ease}
.fc.vao-t .fc-in{animation:vaoT .24s ease}
@keyframes vaoP{from{transform:translateX(44px);opacity:.3}to{transform:none;opacity:1}}
@keyframes vaoT{from{transform:translateX(-44px);opacity:.3}to{transform:none;opacity:1}}
.mat{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--the-kem);border:1px solid var(--vien);border-radius:22px;box-shadow:0 14px 30px #43281a24;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:min(2.2cqh,12px);text-align:center;padding:46px clamp(12px,3cqw,40px) 24px;overflow:auto}
.sau{transform:rotateX(180deg);background:var(--the-sau)}
.sau .nghia{color:var(--nau)}
.mat-top{position:absolute;top:12px;left:16px;right:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.mat-top .nhan{font-size:13px;font-weight:700;color:var(--nau);text-align:left}
.mat-top div{display:flex;gap:2px}
.mat-goi{position:absolute;bottom:8px;left:0;right:0;font-size:12.5px;font-weight:600;color:var(--nau)}
.pic{display:grid;place-items:center;flex:none;background:#fff;border-radius:50%;box-shadow:0 8px 22px #43281a1f;width:min(44cqh,62cqw);height:min(44cqh,62cqw)}
.pic img{display:block;width:72%;height:72%;object-fit:contain}
.pic.nho{width:min(15cqh,84px);height:min(15cqh,84px)}
.so-tile{display:grid;place-items:center}
.khoi{display:flex;flex-direction:column;align-items:center;gap:min(2cqh,10px);min-width:0}
.mat.anh{flex-direction:column}

 <div class="dong"><span class="small muted">Số câu hỏi</span><div class="chips">${[5,10,20].map(n=>`<button class="chip" data-a="qn" data-v="${n}" aria-pressed="${UI.qn===n}">${n}</button>`).join('')}</div></div></section>
 <div class="mcards">${MODES.map(([k,l,d])=>`<button class="mc" data-a="mode" data-v="${k}">${ic(k)}<div><b>${l}</b><span>${d}</span></div></button>`).join('')}</div></div>`}

function vProgress(){const o=ORD(),seen=o.filter(id=>C(id)?.seen),st=k=>o.filter(id=>status(id)[0]===k),att=[...st('quen'),...st('kho')];
 const lines=LV().lessons.map(ls=>{const n=ls.words.filter(x=>C(x.id)?.seen).length;return `<div class="lrow"><span title="${esc(lsLabel(ls))}">${lsLabel(ls)}</span><span>${n}/${ls.words.length}</span><div class="bar"><i style="width:${n/ls.words.length*100}%"></i></div></div>`}).join('');
 return `<div class="pg"><div class="side-h" style="justify-content:space-between">${levelChips()}${UI.reset?`<div class="chips"><button class="chip" data-a="reset-no">Giữ lại</button><button class="chip" data-a="reset-yes" style="color:var(--sai);border-color:var(--sai)">Xoá hết</button></div>`:`<button class="chip" data-a="reset">Xoá tiến độ</button>`}</div>
 <div class="tiles">${[['Đã học',seen.length+'/'+o.length],['Đã nhớ',st('nho').length],['Từ khó',st('kho').length],['Hay quên',st('quen').length]].map(([a,b])=>`<div class="panel"><span class="so">${b}</span><span class="small muted">${a}</span></div>`).join('')}</div>
 <div class="pgs"><section class="panel"><div class="p-head" style="margin-bottom:6px"><h2>Theo từng bài</h2></div><div class="lrows">${lines}</div></section>
 <section class="panel"><div class="p-head" style="margin-bottom:6px"><h2>Từ cần chú ý</h2>${att.length?`<button class="chip" data-a="learn-att">Ôn ${att.length} từ</button>`:''}</div><div class="grow">${att.length?`<div class="preview">${att.slice(0,40).map(id=>`<span>${esc(WORDS[id].w)}</span>`).join('')}</div>`:'<p class="muted small">Từ nào chấm Sai, Quên hoặc Khó sẽ hiện ở đây để ôn riêng.</p>'}</div></section></div>
 <p class="cred">Tiến độ lưu trên trình duyệt này. Hình minh hoạ: Fluent Emoji (Microsoft, MIT), Twemoji (CC BY 4.0).</p></div>`}

/* Sessions */
function openS(){const e=$('#study');e.hidden=false;e.className='study';document.body.style.overflow='hidden'}
function closeS(){clearInterval(ses?.timer);ses=null;const e=$('#study');e.hidden=true;e.innerHTML='';document.body.style.overflow='';render()}
const topBar=(p,d)=>`<div class="st-top"><button class="st-x" data-a="quit" aria-label="Thoát">${ic('close')}</button><div class="bar"><i style="width:${p}%"></i></div><span class="st-dem">${d}</span></div>`;
function drawS(a){openS();({flash:()=>ses.end?drawResult():drawFlash(a),quiz:()=>ses.end?drawQuizEnd():drawQuiz(),write:()=>ses.end?drawQuizEnd():drawWrite(),match:drawMatch}[ses.k])();$('#study').scrollTop=0}
function startFlash(ids){if(!ids.length)return;ses={k:'flash',q:[...ids],i:0,flip:false,total:new Set(ids).size,done:new Set(),st:{sai:0,quen:0,kho:0,dung:0},mark:new Set()};drawS()}
function drawFlash(a){const id=ses.q[ses.i],x=WORDS[id];
 $('#study').innerHTML=topBar(ses.done.size/ses.total*100,`${ses.done.size} / ${ses.total}`)+`<div class="st-body">${cardHtml(x,ses.flip,lsMark(x),a)}${rateHtml(id,ses.flip)}<p class="phim"><kbd>Dấu cách</kbd> lật thẻ · <kbd>1</kbd>–<kbd>4</kbd> chấm Sai, Quên, Khó, Đúng</p></div>`}
const lsMark=x=>`${x.lv.name} · Bài ${x.ls.no}`;
function doRate(r){const id=ses.q[ses.i];rate(id,r);ses.st[r]++;if(r!=='dung')ses.mark.add(id);if(r==='sai'||r==='quen')ses.q.splice(Math.min(ses.i+4,ses.q.length),0,id);else ses.done.add(id);ses.i++;ses.flip=false;if(ses.i>=ses.q.length)ses.end=true;drawS('p')}
function drawResult(){const s=ses.st,m=[...ses.mark];$('#study').innerHTML=topBar(100,`${ses.total} / ${ses.total}`)+`<div class="st-body"><div class="res"><h2>Xong ${ses.total} từ rồi!</h2><p>${m.length?'Những từ bên dưới sẽ được nhắc lại sớm hơn.':'Bạn nhớ hết tất cả từ trong lượt này.'}</p>
 <div class="tk"><div class="d-sai"><span class="so">${s.sai}</span>Sai</div><div class="d-quen"><span class="so">${s.quen}</span>Quên</div><div class="d-kho"><span class="so">${s.kho}</span>Khó</div><div class="d-dung"><span class="so">${s.dung}</span>Đúng</div></div>
 ${m.length?`<div class="dsw">${m.map(id=>`<span><b>${esc(WORDS[id].w)}</b>${WORDS[id].vi}</span>`).join('')}</div>`:''}
 <div class="hang"><button class="btn" data-a="quit">Thoát</button><button class="btn chinh" data-a="res-quiz">Làm bài tập với các từ này</button></div></div></div>`}

function mkQ(id,exam){const x=WORDS[id],ok=i=>i!==id&&WORDS[i].w!==x.w&&WORDS[i].vi!==x.vi,o=[...shuffle(x.ls.words.map(y=>y.id).filter(ok)),...shuffle(ALL[x.lv.id].filter(ok))];
 const types=['nghia','tu'];if(picUrl(x))types.push('anh','anh');if(x.ex&&x.ex.includes(x.w)&&x.ex.replace(x.w,'').trim())types.push('dien','dien');
 return{id,t:shuffle(types)[0],opts:shuffle([id,...o.slice(0,3)])}}
function startQuiz(ids,exam){const seq=ids.slice(0,UI.qn);if(!seq.length)return;ses={k:'quiz',exam:!!exam,q:seq.map(id=>mkQ(id,exam)),i:0,pick:null,ok:0,bad:[],log:[]};drawS()}
function drawQuiz(){const q=ses.q[ses.i],x=WORDS[q.id],ans=ses.pick!==null&&!ses.exam,hanOpt=q.t!=='nghia';const qp=picUrl(x)?`<span class="pic" style="width:min(82cqh,60cqw);height:min(82cqh,60cqw)"><img src="${picUrl(x)}" alt=""></span>`:'';
 const L={nghia:'Từ này nghĩa là gì?',tu:'Từ tiếng Hàn nào có nghĩa này?',dien:'Chọn từ đúng để điền vào câu',anh:'Hình này là từ nào?'};
 const de={anh:qp,nghia:`<div class="tu ${szT(x.w)==='c1'?'c2':szT(x.w)}">${esc(x.w)}</div>`,tu:`<div class="nghia ${szN(x.vi)==='c1'?'c2':'c3'}">${x.vi}</div>`,
  dien:`<div class="q-cau">${(x.ex||'').replace(x.w,'<u>&nbsp;</u>')}</div><div class="muted">${x.exv||''}</div>`}[q.t];
 $('#study').innerHTML=topBar(ses.i/ses.q.length*100,`${ses.i+1} / ${ses.q.length}`)+`<div class="st-body"><div class="hep"><span class="q-loai">${L[q.t]}</span><div class="q-de">${de}</div>
 <div class="opts">${q.opts.map((o,i)=>{const y=WORDS[o],c=ans?(o===q.id?' dung':o===ses.pick?' sai':''):'';return `<button class="opt${hanOpt?' hanq':''}${c}" data-a="ans" data-v="${o}"${ans?' disabled':''}><i>${i+1}</i>${hanOpt?esc(y.w):y.vi}</button>`}).join('')}</div>
 ${ans?`<div class="kq ${ses.pick===q.id?'ok':'no'}"><p>${ses.pick===q.id?'Chính xác!':'Chưa đúng.'} <span>${esc(x.w)}</span> [<span>${esc(x.pr)}</span>]: ${x.vi}</p><button class="btn chinh" data-a="next" id="nx">${ses.i+1<ses.q.length?'Câu tiếp theo':'Xem kết quả'}</button></div>`:''}</div></div>`;}
function doAns(o){if(ses.pick!==null)return;const q=ses.q[ses.i],good=o===q.id;ses.pick=o;ses.log.push({id:q.id,you:o,good});if(good){ses.ok++;rate(q.id,'dung')}else{ses.bad.push(q.id);rate(q.id,'sai')}if(ses.exam)nextQ();else drawS()}
function nextQ(){ses.i++;ses.pick=null;ses.input='';ses.ans=null;ses.hint=0;if(ses.i>=ses.q.length)ses.end=true;drawS()}
function drawQuizEnd(){const n=ses.q.length,b=ses.bad,p=Math.round(ses.ok/n*100);
 const det=ses.exam?`<div class="lg">${ses.log.map(l=>{const x=WORDS[l.id];return `<div><b>${esc(x.w)}</b><span>${x.vi}${l.good?'':`<br><small style="color:var(--sai)">Bạn chọn: ${esc(WORDS[l.you].vi)}</small>`}</span><span style="color:var(--${l.good?'dung':'sai'})">${l.good?'✓':'✗'}</span></div>`}).join('')}</div>`:(b.length?`<div class="dsw">${b.map(id=>`<span><b>${esc(WORDS[id].w)}</b>${WORDS[id].vi}</span>`).join('')}</div>`:'');
 $('#study').innerHTML=topBar(100,`${n} / ${n}`)+`<div class="st-body"><div class="res"><h2>Đúng ${ses.ok}/${n} câu (${p}%)</h2><p>${b.length?'Các từ làm sai đã được đưa vào lịch ôn sớm.':'Làm đúng tất cả. Giỏi lắm!'}</p>${det}
 <div class="hang"><button class="btn" data-a="quit">Thoát</button>${b.length?`<button class="btn chinh" data-a="bad-learn">Học lại ${new Set(b).size} từ sai</button>`:''}</div></div></div>`}

const norm=s=>s.normalize('NFC').replace(/[\s?.!,]/g,'');
const typable=id=>!/[\/()a-zA-Z0-9]/.test(WORDS[id].w);
function startWrite(ids){const seq=ids.filter(typable).slice(0,UI.qn);if(!seq.length){toast('Nhóm từ này không có từ phù hợp để gõ.');return}ses={k:'write',q:seq.map(id=>({id})),i:0,ok:0,bad:[],log:[],ans:null,hint:0,input:''};drawS()}
function drawWrite(){const q=ses.q[ses.i],x=WORDS[q.id],a=ses.ans,syl=[...x.w];
 $('#study').innerHTML=topBar(ses.i/ses.q.length*100,`${ses.i+1} / ${ses.q.length}`)+`<div class="st-body"><div class="hep"><span class="q-loai">Gõ từ tiếng Hàn có nghĩa này</span><div class="q-de">${picUrl(x)?`<span class="pic" style="width:min(50cqh,50cqw);height:min(50cqh,50cqw)"><img src="${picUrl(x)}" alt=""></span>`:''}<div class="nghia ${szN(x.vi)==='c1'?'c2':'c3'}">${x.vi}</div>${ses.hint?`<div class="phu muted">${syl.slice(0,ses.hint).join('')}${'＿'.repeat(Math.max(0,syl.length-ses.hint))}</div>`:''}</div>
 <form class="go" id="goF"><input id="goI" value="${esc(ses.input||'')}" placeholder="Gõ tiếng Hàn" autocomplete="off" autocapitalize="off" lang="ko"${a?' disabled':''}>${a?'':`<button class="btn chinh" type="submit">Kiểm tra</button>`}</form>
 ${a?`<div class="kq ${a==='ok'?'ok':'no'}"><p>${a==='ok'?'Chính xác!':'Đáp án đúng:'} <span>${esc(x.w)}</span> [<span>${esc(x.pr)}</span>]</p><button class="btn chinh" data-a="next" id="nx">${ses.i+1<ses.q.length?'Câu tiếp theo':'Xem kết quả'}</button></div>`:`<div class="hang"><button class="btn" data-a="hint">Gợi ý</button><button class="btn" data-a="dunno">Không nhớ</button></div>`}</div></div>`;
 if(!a)$('#goI').focus();else $('#nx')?.focus()}
function checkW(v){const q=ses.q[ses.i],x=WORDS[q.id],good=v!==null&&norm(v)===norm(x.w);ses.input=v||'';ses.ans=good?'ok':'no';if(good){ses.ok++;rate(q.id,ses.hint?'kho':'dung')}else{ses.bad.push(q.id);rate(q.id,v===null?'quen':'sai')}drawS()}

function startMatch(ids){const seen=new Set(),vis=new Set(),use=[];for(const id of ids){const x=WORDS[id];if(seen.has(x.w)||vis.has(x.vi))continue;seen.add(x.w);vis.add(x.vi);use.push(id);if(use.length===6)break}
 if(use.length<3){toast('Cần ít nhất 3 từ để ghép thẻ.');return}
 const key=curLs()&&UI.src==='lesson'?`${S.level}-${UI.lesson[S.level]}`:'khac';
 ses={k:'match',key,tiles:shuffle(use.flatMap(id=>[{id,s:'k'},{id,s:'v'}])),sel:null,left:use.length,t0:Date.now(),time:0,timer:setInterval(()=>{const e=$('#mt');if(e)e.textContent=((Date.now()-ses.t0)/1000).toFixed(1)+' giây'},100)};drawS()}
function drawMatch(){if(ses.end){const b=S.best[ses.key];$('#study').innerHTML=topBar(100,'Xong')+`<div class="st-body"><div class="res"><h2>Hoàn thành trong ${ses.time.toFixed(1)} giây</h2><p>${b?`Kỷ lục của bài này: ${b.toFixed(1)} giây`:''}</p><div class="hang"><button class="btn" data-a="quit">Thoát</button><button class="btn chinh" data-a="match-again">Chơi lại</button></div></div></div>`;return}
 $('#study').innerHTML=topBar(0,'<span id="mt">0.0 giây</span>')+`<div class="st-body"><span class="q-loai">Bấm vào từ rồi bấm vào nghĩa của nó</span><div class="khop">${ses.tiles.map((t,i)=>{const x=WORDS[t.id];return `<button class="tile${t.s==='k'?' han':''}" data-a="tile" data-v="${i}">${t.s==='k'?esc(x.w):x.vi}</button>`}).join('')}</div></div>`}
function tapTile(i,el){if(el.classList.contains('xong'))return;const t=ses.tiles[i];
 if(ses.sel===null){ses.sel=i;el.classList.add('chon1');return}
 const a=ses.tiles[ses.sel],ae=$(`.tile[data-v="${ses.sel}"]`);ae.classList.remove('chon1');
 if(ses.sel===i){ses.sel=null;return}
 if(a.id===t.id&&a.s!==t.s){ae.classList.add('xong');el.classList.add('xong');ses.left--;if(!ses.left){clearInterval(ses.timer);ses.time=(Date.now()-ses.t0)/1000;if(ses.key!=='khac'&&(!S.best[ses.key]||ses.time<S.best[ses.key])){S.best[ses.key]=ses.time;save()}ses.end=true;drawS()}}
 else{[ae,el].forEach(e=>{e.classList.add('loi');setTimeout(()=>e.classList.remove('loi'),320)})}
 ses.sel=null}
function runMode(k,ids){if(k==='smart'){const l=[...ids].sort((a,b)=>weak(b)-weak(a));startFlash(l)}else if(k==='quiz')startQuiz(ids);else if(k==='test')startQuiz(ids,true);else if(k==='write')startWrite(ids);else startMatch(ids)}

/* Events */
let swiped=false;
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-a]');if(!t||t.disabled)return;const a=t.dataset.a,v=t.dataset.v;
 if(a==='flip'&&swiped){swiped=false;return}
 const cx=()=>ses||UI.b;
 ({tab(){UI.tab=v;UI.reset=false;render();window.scrollTo(0,0)},
  'today-start'(){startFlash(todayQueue())},
  daily(){S.daily=+v;save();render()},
  level(){S.level=v;save();UI.q='';UI.src=UI.src==='sel'?'lesson':UI.src;buildB();render()},
  filter(){UI.filter=v;drawList()},
  sheet(){UI.sheet=!UI.sheet;$('#side').classList.toggle('mo',UI.sheet);drawList()},
  jump(){const x=WORDS[v];if(x.ls.no!==UI.lesson[S.level]){UI.lesson[S.level]=x.ls.no;UI.q='';buildB();UI.sheet=false;render()}const i=UI.b.ids.indexOf(v);if(i>=0){UI.b.i=i;UI.b.flip=false;UI.sheet=false;$('#side')?.classList.remove('mo');stageB('p')}},
  img(){S.img=S.img===false;save();stageB()},
  star(){const c=S.cards[v]||(S.cards[v]=blank());c.star=!c.star;save();if(ses)drawS();else{stageB();drawList()}},
  pick(){UI.sel[t.checked?'add':'delete'](v);drawList()},
  all(){const l=$('#list').dataset.list.split(',').filter(Boolean),on=l.every(i=>UI.sel.has(i));l.forEach(i=>UI.sel[on?'delete':'add'](i));drawList()},
  clear(){UI.sel.clear();drawList()},
  'sel-learn'(){startFlash([...UI.sel])},
  'sel-quiz'(){UI.src='sel';UI.tab='practice';render()},
  'learn-att'(){startFlash(ORD().filter(id=>['quen','kho'].includes(status(id)[0])))},
  src(){UI.src=v;render()},qn(){UI.qn=+v;render()},
  mode(){runMode(v,pool())},
  reset(){UI.reset=true;render()},'reset-no'(){UI.reset=false;render()},
  'reset-yes'(){S=fresh();save();UI.reset=false;buildB();render();toast('Đã xoá tiến độ.')},
  quit:closeS,
  flip(){const c=cx();setFlip(c,!c.flip)},
  go(){goB(+v)},
  mix(){UI.b.mix=!UI.b.mix;buildB();stageB()},
  auto:toggleAuto,
  onlystar(){UI.b.star=!UI.b.star;buildB();stageB()},
  dir(){S.dir=S.dir==='vi'?'ko':'vi';save();cx().flip=false;if(ses)drawS();else stageB()},
  rate(){if(ses)doRate(v);else{rate(UI.b.ids[UI.b.i],v);goB(1);refreshList()}},
  'res-quiz'(){const ids=shuffle([...ses.done]);ses=null;startQuiz(ids)},
  ans(){doAns(v)},next:nextQ,
  hint(){const n=[...WORDS[ses.q[ses.i].id].w].length;ses.input=$('#goI').value;ses.hint=Math.min(n,ses.hint+1);drawS()},
  dunno(){checkW(null)},
  tile(){tapTile(+v,t)},
  'match-again'(){const ids=[...new Set(ses.tiles.map(x=>x.id))];runMode('match',shuffle(pool()))},
  'bad-learn'(){startFlash([...new Set(ses.bad)])}
 })[a]?.()});
function refreshList(){drawList()}
document.addEventListener('change',e=>{if(e.target.dataset.ls){UI.lesson[S.level]=+e.target.value;UI.q='';buildB();render()}});
document.addEventListener('input',e=>{if(e.target.id==='q'){UI.q=e.target.value;drawList()}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='goF'){const v=$('#goI').value;if(v.trim())checkW(v)}});
document.addEventListener('keydown',e=>{const tag=e.target.tagName;if(tag==='INPUT'||tag==='SELECT')return;
 const inS=ses&&!ses.end,br=!ses&&UI.tab==='cards'&&UI.b.ids.length;
 if((inS&&ses.k==='flash')||br){const c=ses||UI.b;
  if(e.code==='Space'){e.preventDefault();setFlip(c,!c.flip)}
  else if(br&&e.key==='ArrowRight'){e.preventDefault();goB(1)}else if(br&&e.key==='ArrowLeft'){e.preventDefault();goB(-1)}
  else if(c.flip&&'1234'.includes(e.key)){const r=['sai','quen','kho','dung'][+e.key-1];if(ses)doRate(r);else{rate(UI.b.ids[UI.b.i],r);goB(1);refreshList()}}}
 else if(inS&&ses.k==='quiz'){if(ses.pick===null&&'1234'.includes(e.key)){const o=ses.q[ses.i].opts[+e.key-1];if(o)doAns(o)}else if(ses.pick!==null&&e.key==='Enter'){e.preventDefault();nextQ()}}});
let tx=0,ty=0;
document.addEventListener('touchstart',e=>{if(e.target.closest('#fc')){tx=e.touches[0].clientX;ty=e.touches[0].clientY}},{passive:true});
document.addEventListener('touchend',e=>{if(!e.target.closest('#fc')||ses)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){swiped=true;goB(dx<0?1:-1);setTimeout(()=>swiped=false,350)}},{passive:true});
buildB();render();
</script>

</body></html>
